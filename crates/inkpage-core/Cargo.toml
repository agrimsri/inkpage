[package]
name = "inkpage-core"
version = "0.1.2"
edition = "2021"
description = "Core storage engine, SQLite FTS5 index, export, and RPC server for Inkpage"

[[bin]]
name = "inkpage-server"
path = "src/main.rs"

[dependencies]
inkpage-import = { path = "../inkpage-import" }
inkpage-onestore = { path = "../inkpage-onestore" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = { version = "1.1", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
walkdir = "2.5"
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"

