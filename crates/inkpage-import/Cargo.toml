[package]
name = "inkpage-import"
version = "0.1.2"
edition = "2021"
description = "OneNote semantic importer and IR converter for Inkpage"

[[bin]]
name = "inkpage-import"
path = "src/main.rs"

[dependencies]
inkpage-onestore = { path = "../inkpage-onestore" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
ulid = { version = "1.1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
cab = "0.6"
tempfile = "3.10"
walkdir = "2.5"
typed-path = "0.12"
