name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage & deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libssl-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Rust backend
        run: cargo build --release --bin inkpage-server

      - name: Stage backend binary
        run: node scripts/prepare-backend.mjs

      - name: Build web packages
        run: pnpm build

      - name: Package Linux installers (AppImage and deb)
        run: pnpm --filter @inkpage/desktop run package:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.blockmap
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS & Portable)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Rust backend
        run: cargo build --release --bin inkpage-server

      - name: Stage backend binary
        run: node scripts/prepare-backend.mjs

      - name: Build web packages
        run: pnpm build

      - name: Package Windows installers (.exe)
        run: pnpm --filter @inkpage/desktop run package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
          if-no-files-found: error

  build-macos:
    name: Build macOS (Universal DMG & ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with Universal Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Rust backend for x86_64 and aarch64
        run: |
          cargo build --release --bin inkpage-server --target x86_64-apple-darwin
          cargo build --release --bin inkpage-server --target aarch64-apple-darwin

      - name: Assemble Universal macOS backend binary
        run: |
          mkdir -p apps/desktop/resources/bin
          lipo -create -output apps/desktop/resources/bin/inkpage-server \
            target/x86_64-apple-darwin/release/inkpage-server \
            target/aarch64-apple-darwin/release/inkpage-server
          chmod +x apps/desktop/resources/bin/inkpage-server

      - name: Build web packages
        run: pnpm build

      - name: Package macOS installers (DMG and ZIP)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @inkpage/desktop run package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.blockmap
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist-artifacts
          sha256sum * > ../SHA256SUMS.txt || true
          mv ../SHA256SUMS.txt ./
          cat SHA256SUMS.txt

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
