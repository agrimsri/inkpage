<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkpage — Free, Open-Source, Note-Taking</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('inkpage_theme') || 'system';
          var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        background-color: var(--color-bg-window, #f5f5f7);
        color: var(--color-label-primary, #1d1d1f);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        background-color: rgba(0, 113, 227, 0.22);
        color: inherit;
      }
      [data-theme='dark'] ::selection {
        background-color: rgba(41, 151, 255, 0.32);
      }

      /* macOS-inspired refined scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb, rgba(0, 0, 0, 0.16));
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover, rgba(0, 0, 0, 0.28));
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      /* Accessible and crisp focus outline */
      :focus-visible {
        outline: 2px solid #0071e3 !important;
        outline-offset: 1px !important;
      }

      /* Range sliders styling */
      input[type="range"] {
        accent-color: #0071e3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
